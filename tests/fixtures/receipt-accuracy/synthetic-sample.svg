<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title description">
  <title id="title">Synthetic OCR test receipt</title>
  <desc id="description">A fictional sample receipt used only to test the accuracy harness. It is not a tax document.</desc>
  <rect width="720" height="500" fill="#f1f1ed" />
  <rect x="130" y="30" width="460" height="440" rx="8" fill="#fff" stroke="#c8c8c1" stroke-width="2" />
  <text x="360" y="74" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#a13c30">SYNTHETIC SAMPLE — NOT A TAX DOCUMENT</text>
  <text x="360" y="132" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#222">Sample Office Ltd</text>
  <text x="175" y="190" font-family="monospace" font-size="17" fill="#333">TIN: SYNTHETIC-ONLY</text>
  <text x="175" y="230" font-family="monospace" font-size="17" fill="#333">Date: 2026-10-15</text>
  <text x="175" y="270" font-family="monospace" font-size="17" fill="#333">Reference: SAMPLE-001</text>
  <path d="M175 300h370" stroke="#bbb" />
  <text x="175" y="340" font-family="monospace" font-size="17" fill="#333">Amount RWF: 12,000</text>
  <text x="175" y="380" font-family="monospace" font-size="17" fill="#333">VAT: 0</text>
  <text x="360" y="435" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Synthetic harness fixture. Do not use as evidence.</text>
</svg>
